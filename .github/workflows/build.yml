name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

# one run per branch at a time: each release must see the previous release's tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the next version number

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Test
        run: dotnet test ClaudeUsageBar.sln -c Release --nologo

      - name: Version
        id: version
        run: |
          $version = ./tools/next-version.ps1
          "version=$version" >> $env:GITHUB_OUTPUT
          "Version: $version"

      - name: Package
        run: ./tools/package.ps1 -Version ${{ steps.version.outputs.version }} -Out dist

      - uses: actions/upload-artifact@v7
        with:
          name: ClaudeUsageBar-${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ClaudeUsageBar-${{ needs.build.outputs.version }}
          path: dist

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: >
          gh release create "$TAG" dist/*
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "ClaudeUsageBar $TAG"
          --generate-notes
